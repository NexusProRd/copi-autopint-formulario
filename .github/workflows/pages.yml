name: Publicar cuestionario en GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_GAS_QUESTIONS_URL: ${{ vars.GAS_QUESTIONS_URL }}
          NEXT_PUBLIC_FORM_API_URL: ${{ vars.FORM_API_URL }}
          NEXT_PUBLIC_NEXUS_WHATSAPP: ${{ vars.NEXUS_WHATSAPP }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
      - id: deployment
        uses: actions/deploy-pages@v4
